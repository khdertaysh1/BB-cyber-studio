plugins { id 'com.android.application' }

android {
    namespace 'studio.bb.cyber'
    compileSdk 35
    defaultConfig {
        applicationId 'studio.bb.cyber'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.5.0-alpha'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    signingConfigs {
        release {
            if (System.getenv('BLUE_DRAGON_KEYSTORE_FILE')) {
                storeFile file(System.getenv('BLUE_DRAGON_KEYSTORE_FILE'))
                storePassword System.getenv('BLUE_DRAGON_KEYSTORE_PASSWORD')
                keyAlias System.getenv('BLUE_DRAGON_KEY_ALIAS')
                keyPassword System.getenv('BLUE_DRAGON_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('BLUE_DRAGON_KEYSTORE_FILE')) signingConfig signingConfigs.release
        }
    }
    lint { abortOnError true }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

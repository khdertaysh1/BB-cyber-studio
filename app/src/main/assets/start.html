<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>New tab</title>
<style>
:root{color-scheme:dark;--bg:#0c1420;--ink:#edf4ff;--muted:#9baec5;--line:#24364f;--surface:#152235;--blue:#75acfa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:620px;margin:0 auto;padding:clamp(30px,10vh,95px) 24px 42px}
.brand{display:flex;align-items:center;gap:11px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:1.3px}
.mark{display:grid;place-items:center;background:#1e3552;color:#acd1ff;width:42px;height:42px;border:1px solid #345d88;border-radius:13px;font-size:16px;letter-spacing:0}
h1{font-size:clamp(31px,8vw,47px);font-weight:680;letter-spacing:-1.7px;line-height:1.08;margin:42px 0 15px}
p{max-width:390px;line-height:1.65;font-size:14px;color:var(--muted);margin:0 0 28px}
form{display:flex;align-items:center;border:1px solid #3a506d;border-radius:18px;background:var(--surface);padding:6px 7px 6px 17px;box-shadow:0 16px 35px #0002}
input{min-width:0;flex:1;background:transparent;border:0;outline:0;color:var(--ink);font:15px system-ui;padding:13px 3px}
input::placeholder{color:#a0b0c5}button{border:0;background:var(--blue);color:#0b1d32;padding:12px 18px;border-radius:13px;font-weight:750;font-size:14px}
.note{color:#8ea3bd;font-size:12px;margin-top:13px;padding-left:3px}
.section{margin-top:55px;padding-top:17px;border-top:1px solid var(--line);font-size:12px;color:#829ab8;line-height:1.9}
@media(max-width:350px){main{padding:35px 17px}h1{margin-top:35px}}
</style>
</head>
<body><main>
<div class="brand"><span class="mark">BB</span><span>BETWEEN BYTES<br>CYBER STUDIO</span></div>
<h1>The web, in focus.</h1>
<p>Browse websites and open your developer tools when you need them.</p>
<form action="https://www.google.com/search" method="get">
<input name="q" type="search" enterkeyhint="search" aria-label="Search Google" placeholder="Search with Google" autocomplete="off">
<button type="submit" aria-label="Search Google">Search</button>
</form>
<div class="note">Google is the default search engine. Enter URLs in the browser address bar.</div>
<div class="section">BROWSE · INSPECT · BUILD<br>Network / Console / Repeater / Elements · Your pages stay in the browser.</div>
</main></body></html>
